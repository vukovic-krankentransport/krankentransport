<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vuković Krankentransport - Dispečer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .header { background-color: #1a252f; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .main-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .form-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; min-width: 320px; }
        .table-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 2; min-width: 500px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        button.btn-submit { background-color: #27ae60; color: white; border: none; padding: 12px; border-radius: 5px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button.btn-submit:hover { background-color: #219150; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e1e4e8; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #f8f9fa; color: #2c3e50; }
        .badge { padding: 5px 10px; border-radius: 12px; color: white; font-weight: bold; font-size: 12px; display: inline-block; }
        .st-1 { background-color: #3498db; }
        .st-2 { background-color: #f39c12; }
        .st-3 { background-color: #9b59b6; }
        .st-4 { background-color: #8e44ad; }
        .st-5 { background-color: #2ecc71; }
    </style>
</head>
<body>

<div class="header">
    <h1>Vuković Krankentransport</h1>
    <span>Dispečerski Centar</span>
</div>

<div class="main-container">
    <div class="form-section">
        <h3>Unos novog naloga</h3>
        <form id="dispoForm">
            <div class="form-group">
                <label>Vozilo</label>
                <select id="vozilo" required>
                    <option value="Fahrzeug 1">Fahrzeug 1</option>
                    <option value="Fahrzeug 2">Fahrzeug 2</option>
                    <option value="Fahrzeug 3">Fahrzeug 3</option>
                    <option value="Fahrzeug 4">Fahrzeug 4</option>
                    <option value="Fahrzeug 5">Fahrzeug 5</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tip transporta</label>
                <input type="text" id="tipTransporta" value="Sitzend">
            </div>
            <div class="form-group">
                <label>Pacijent (Ime i prezime)</label>
                <input type="text" id="pacijent" required placeholder="Unesite ime pacijenta">
            </div>
            <div class="form-group">
                <label>Datum rođenja</label>
                <input type="date" id="datumRodjenja">
            </div>
            <div class="form-group">
                <label>Datum i vreme polaska</label>
                <input type="date" id="datum">
                <input type="time" id="vreme" style="margin-top: 5px;">
            </div>
            <div class="form-group">
                <label>Adresa polaska (Von)</label>
                <input type="text" id="adresaPolazak" required placeholder="Polazna adresa">
            </div>
            <div class="form-group">
                <label>Adresa odredišta (Nach)</label>
                <input type="text" id="adresaOdrediste" required placeholder="Odredišna adresa">
            </div>
            <div class="form-group">
                <label>Grund (Razlog)</label>
                <input type="text" id="grund" placeholder="Razlog/napomena za vožnju">
            </div>
            <button type="submit" class="btn-submit">Pošalji nalog vozaču</button>
        </form>
    </div>

    <div class="table-section">
        <h3>Aktivni nalozi</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Vozilo</th>
                    <th>Pacijent</th>
                    <th>Ruta (Von ➔ Nach)</th>
                    <th>Grund</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabelaVoznji"></tbody>
        </table>
    </div>
</div>

<script>
    async function ucitajVoznje() {
        try {
            const res = await fetch('/api/voznje');
            const voznje = await res.json();
            const tbody = document.getElementById('tabelaVoznji');
            tbody.innerHTML = '';

            voznje.filter(v => v.status !== 'Frei' && v.status !== 'Erledigt' && v.status !== 'Status 5').forEach(v => {
                let badgeClass = 'st-1';
                if(v.status === 'Status 2') badgeClass = 'st-2';
                if(v.status === 'Status 3') badgeClass = 'st-3';
                if(v.status === 'Status 4') badgeClass = 'st-4';

                tbody.innerHTML += `
                    <tr>
                        <td><b>#${v.id}</b></td>
                        <td>${v.vozilo}</td>
                        <td>${v.pacijent}<br><small style="color:#666;">${v.datumRodjenja || ''}</small></td>
                        <td>${v.adresaPolazak}<br>➔ ${v.adresaOdrediste}</td>
                        <td><b>${v.grund || '-'}</b></td>
                        <td><span class="badge ${badgeClass}">${v.status}</span></td>
                    </tr>
                `;
            });
        } catch(e) {}
    }

    document.getElementById('dispoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            vozilo: document.getElementById('vozilo').value,
            tipTransporta: document.getElementById('tipTransporta').value,
            pacijent: document.getElementById('pacijent').value,
            datumRodjenja: document.getElementById('datumRodjenja').value,
            datum: document.getElementById('datum').value,
            vreme: document.getElementById('vreme').value,
            adresaPolazak: document.getElementById('adresaPolazak').value,
            adresaOdrediste: document.getElementById('adresaOdrediste').value,
            grund: document.getElementById('grund').value
        };

        await fetch('/api/voznje', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        document.getElementById('dispoForm').reset();
        ucitajVoznje();
    });

    setInterval(ucitajVoznje, 3000);
    ucitajVoznje();
</script>
</body>
</html>
