<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vozač - Krankentransport</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #f4f4f9; margin: 0; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        select { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 15px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; background-color: #007bff; }
        .btn.active { background-color: #6c757d !important; cursor: not-allowed; }
        .info { font-size: 15px; color: #333; margin-bottom: 6px; }
        .nav-link { display: inline-block; background: #17a2b8; color: white; text-decoration: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; margin-top: 5px; margin-bottom: 5px; }
        .badge-infekcija { background: #dc3545; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Aplikacija za Vozača</h2>
    <div class="card">
        <label><b>Izaberite vaše vozilo:</b></label>
        <select id="voziloSelect" onchange="snimiVozilo()">
            <option value="">-- Izaberi vozilo --</option>
            <script>
                for(let i=1; i<=10; i++) {
                    document.write(`<option value="Vozilo ${i}">Vozilo ${i}</option>`);
                }
            </script>
        </select>
    </div>

    <div id="voznjeKontejner"></div>

    <script>
        if(localStorage.getItem('izabranoVozilo')) {
            document.getElementById('voziloSelect').value = localStorage.getItem('izabranoVozilo');
        }

        function snimiVozilo() {
            const val = document.getElementById('voziloSelect').value;
            localStorage.setItem('izabranoVozilo', val);
            ucitajVoznje();
        }

        async function ucitajVoznje() {
            const mojeVozilo = localStorage.getItem('izabranoVozilo');
            const kontejner = document.getElementById('voznjeKontejner');

            if(!mojeVozilo) {
                kontejner.innerHTML = '<div class="card"><p>Izaberite broj vozila iznad.</p></div>';
                return;
            }

            const res = await fetch('/api/voznje');
            const podaci = await res.json();
            kontejner.innerHTML = '';

            const mojeVoznje = podaci.filter(v => v.vozilo === mojeVozilo && v.status !== 'Završeno');

            if(mojeVoznje.length === 0) {
                kontejner.innerHTML = '<div class="card"><p>Nema aktivnih naloga za vaše vozilo.</p></div>';
                return;
            }

            mojeVoznje.forEach(v => {
                const mapsPolazak = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.adresaPolazak)}`;
                const mapsOdrediste = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(v.adresaOdrediste)}`;

                kontejner.innerHTML += `
                    <div class="card">
                        <h3>Pacijent: ${v.pacijent}</h3>
                        <p class="info"><b>Kasa / Osiguranje:</b> ${v.kasa || 'Nije navedeno'}</p>
                        <p class="info"><b>Vreme preuzimanja:</b> <span style="color:red; font-weight:bold;">${v.vreme || 'Hitno'}</span></p>
                        <p class="info"><b>Infekcija:</b> ${v.infekcija === 'DA' ? '<span class="badge-infekcija">DA (Oprez!)</span>' : 'NE'}</p>
                        <hr>
                        <p class="info"><b>Polazak:</b> ${v.adresaPolazak}</p>
                        <a href="${mapsPolazak}" target="_blank" class="nav-link">📍 Navigacija do polaska</a>
                        
                        <p class="info" style="margin-top:10px;"><b>Odredište:</b> ${v.adresaOdrediste || 'Nije navedeno'}</p>
                        ${v.adresaOdrediste ? `<a href="${mapsOdrediste}" target="_blank" class="nav-link">🏁 Navigacija do odredišta</a>` : ''}
                        
                        <p class="info" style="margin-top:10px;"><b>Napomena:</b> ${v.napomena || 'Nema'}</p>
                        <hr>
                        <button class="btn ${v.status === 'Prihvaćeno' ? 'active' : ''}" onclick="promeniStatus(${v.id}, 'Prihvaćeno')">1. Prihvaćeno</button>
                        <button class="btn ${v.status === 'Na adresi' ? 'active' : ''}" onclick="promeniStatus(${v.id}, 'Na adresi')">2. Na adresi</button>
                        <button class="btn ${v.status === 'Pacijent u vozilu' ? 'active' : ''}" onclick="promeniStatus(${v.id}, 'Pacijent u vozilu')">3. Pacijent u vozilu</button>
                        <button class="btn ${v.status === 'Završeno' ? 'active' : ''}" onclick="promeniStatus(${v.id}, 'Završeno')">4. Završeno (Skloni nalog)</button>
                    </div>
                `;
            });
        }

        async function promeniStatus(id, status) {
            await fetch('/api/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status })
            });
            ucitajVoznje();
        }

        setInterval(ucitajVoznje, 4000);
        ucitajVoznje();
    </script>
</body>
</html>
