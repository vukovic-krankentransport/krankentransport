<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vukovic Krankentransporte - Fahrer App</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #f4f6f9; margin: 0; }
        .header { background: #0d6efd; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        .header h2 { margin: 0; }
        
        select { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 15px; font-weight: bold; }
        
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #0d6efd; }
        .card.infekcija { border-left-color: #dc3545; background: #fff5f5; }
        
        .btn-status { width: 100%; padding: 10px; margin-top: 5px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
        .btn-offen { background: #ffc107; color: black; }
        .btn-anfahrt { background: #0d6efd; }
        .btn-patient { background: #fd7e14; }
        .btn-ziel { background: #6f42c1; }
        .btn-erledigt { background: #198754; }

        .chat-section { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .chat-box { height: 200px; overflow-y: auto; background: #f8f9fa; border: 1px solid #ddd; padding: 10px; border-radius: 5px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
        .chat-msg { padding: 8px; border-radius: 5px; font-size: 14px; max-width: 80%; }
        .chat-msg.me { background: #d1e7dd; align-self: flex-end; }
        .chat-msg.dispo { background: #f8d7da; align-self: flex-start; }
    </style>
</head>
<body>

    <div class="header">
        <h2>FAHRER PANEL</h2>
    </div>

    <label><b>Wählen Sie Ihr Fahrzeug:</b></label>
    <select id="mojeVozilo" onchange="promeniVozilo()">
        <option value="Fahrzeug 1">Fahrzeug 1</option>
        <option value="Fahrzeug 2">Fahrzeug 2</option>
        <option value="Fahrzeug 3">Fahrzeug 3</option>
        <option value="Fahrzeug 4">Fahrzeug 4</option>
        <option value="Fahrzeug 5">Fahrzeug 5</option>
        <option value="Fahrzeug 6">Fahrzeug 6</option>
        <option value="Fahrzeug 7">Fahrzeug 7</option>
        <option value="Fahrzeug 8">Fahrzeug 8</option>
        <option value="Fahrzeug 9">Fahrzeug 9</option>
        <option value="Fahrzeug 10">Fahrzeug 10</option>
    </select>

    <h3>Meine Aufträge</h3>
    <div id="listaNaloga"></div>

    <div class="chat-section">
        <h3>💬 Chat mit Zentrale</h3>
        <div id="chatBoxFahrer" class="chat-box"></div>
        <div style="display:flex; gap:5px;">
            <input type="text" id="chatInputFahrer" style="flex:1; padding:10px;" placeholder="Nachricht schreiben..." onkeypress="if(event.key==='Enter') posaljiPoruku()">
            <button onclick="posaljiPoruku()" style="padding:10px 15px; background:#0d6efd; color:white; border:none; border-radius:5px; font-weight:bold;">Senden</button>
        </div>
    </div>

    <script>
        let trenutnoVozilo = localStorage.getItem('izabranoVozilo') || 'Fahrzeug 1';
        document.getElementById('mojeVozilo').value = trenutnoVozilo;

        function promeniVozilo() {
            trenutnoVozilo = document.getElementById('mojeVozilo').value;
            localStorage.setItem('izabranoVozilo', trenutnoVozilo);
            ucitajData();
        }

        async function ucitajData() {
            try {
                const resVoznje = await fetch('/api/voznje');
                const voznje = await resVoznje.json();

                const mojeVoznje = voznje.filter(v => v.vozilo === trenutnoVozilo);
                const container = document.getElementById('listaNaloga');
                container.innerHTML = '';

                if(mojeVoznje.length === 0) {
                    container.innerHTML = '<p style="color:#666;">Keine aktiven Aufträge.</p>';
                }

                mojeVoznje.forEach(v => {
                    const isInfekt = v.infekcija === 'JA';
                    const geb = v.datumRodjenja ? ` (${v.datumRodjenja})` : '';

                    container.innerHTML += `
                        <div class="card ${isInfekt ? 'infekcija' : ''}">
                            <div style="display:flex; justify-content:space-between;">
                                <b>Zeit: ${v.vreme || '-'}</b>
                                <span style="color:${isInfekt ? 'red' : 'green'}; font-weight:bold;">${v.tipTransporta}</span>
                            </div>
                            <hr style="border:0.5px solid #eee;">
                            <p style="margin:5px 0;"><b>Patient:</b> ${v.pacijent}${geb}</p>
                            <p style="margin:5px 0;"><b>Kasse:</b> ${v.kasa || '-'}</p>
                            <p style="margin:5px 0;"><b>Von:</b> ${v.adresaPolazak}</p>
                            <p style="margin:5px 0;"><b>Nach:</b> ${v.adresaOdrediste || '-'}</p>
                            ${v.napomena ? `<p style="margin:5px 0; color:#b02a37;"><b>Info:</b> ${v.napomena}</p>` : ''}
                            ${isInfekt ? `<p style="margin:5px 0; color:red; font-weight:bold;">⚠️ INFEKTIONSFAHRT!</p>` : ''}
                            
                            <div style="margin-top:10px;">
                                <small>Status ändern:</small>
                                <button class="btn-status btn-anfahrt" onclick="promeniStatus(${v.id}, 'Anfahrt')">1. Anfahrt</button>
                                <button class="btn-status btn-patient" onclick="promeniStatus(${v.id}, 'Patient aufgenommen')">2. Patient aufgenommen</button>
                                <button class="btn-status btn-ziel" onclick="promeniStatus(${v.id}, 'Am Ziel')">3. Am Ziel</button>
                                <button class="btn-status btn-erledigt" onclick="promeniStatus(${v.id}, 'Erledigt')">4. Erledigt</button>
                            </div>
                        </div>
                    `;
                });

                // Učitavanje poruka
                const resPoruke = await fetch('/api/poruke');
                const poruke = await resPoruke.json();
                const chatBox = document.getElementById('chatBoxFahrer');
                chatBox.innerHTML = '';

                const mojePoruke = poruke.filter(p => p.vozilo === trenutnoVozilo);
                mojePoruke.forEach(p => {
                    const isMe = p.posiljalac !== 'Zentrale';
                    chatBox.innerHTML += `
                        <div class="chat-msg ${isMe ? 'me' : 'dispo'}">
                            <small>[${p.vreme}]</small> <b>${p.posiljalac}:</b> ${p.tekst}
                        </div>
                    `;
                });
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch(e) {}
        }

        async function promeniStatus(id, noviStatus) {
            await fetch('/api/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status: noviStatus })
            });
            ucitajData();
        }

        async function posaljiPoruku() {
            const input = document.getElementById('chatInputFahrer');
            const tekst = input.value.trim();
            if(!tekst) return;

            await fetch('/api/poruke', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ posiljalac: trenutnoVozilo, vozilo: trenutnoVozilo, tekst })
            });

            input.value = '';
            ucitajData();
        }

        setInterval(ucitajData, 3000);
        ucitajData();
    </script>
</body>
</html>
